<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>v2_右足関節骨折 骨接合術 シミュレーションパズルゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="opening-layer">
        <video id="opening-video" playsinline preload="auto">
            <source src="327101_small.mp4" type="video/mp4">
        </video>
        
        <div id="start-ui" class="hidden">
            <button id="start-btn">手術を始める</button>
        </div>
    </div>

    <div id="game-layer" class="hidden">
        <h1 id="title">右足関節骨折 骨接合術</h1>
        
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <div id="status">読み込み中...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
